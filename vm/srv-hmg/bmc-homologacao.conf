# /etc/httpd/conf.d/bmc-homologacao.conf: homologação dos portais BMC (CI/CD, 2026-11-17).
# Um nome por portal na 443, certificado *.bmchyundai.com.br. Precisa de DNS
# interno hmg-<portal>.bmchyundai.com.br -> 10.7.0.101 (TI). Mesmas regras de proxy da produção.

<VirtualHost *:443>
    ServerName hmg-controladoria.bmchyundai.com.br
    SSLEngine on
    SSLCertificateFile /etc/pki/tls/bmchyundai/cert.pem
    SSLCertificateKeyFile /etc/pki/tls/bmchyundai/privkey.pem
    SSLCertificateChainFile /etc/pki/tls/bmchyundai/chain.pem
    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 300
    <Proxy *>
        Require all granted
    </Proxy>
    # faixa visível: é homologação
    Header always set X-Ambiente "homologacao"
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    RequestHeader set X-Forwarded-Host "hmg-controladoria.bmchyundai.com.br"
    ProxyPass "/" "http://127.0.0.1:13000/" retry=1 timeout=300
    ProxyPassReverse "/" "http://127.0.0.1:13000/"
</VirtualHost>
<VirtualHost *:80>
    ServerName hmg-controladoria.bmchyundai.com.br
    Redirect / https://hmg-controladoria.bmchyundai.com.br/
</VirtualHost>

