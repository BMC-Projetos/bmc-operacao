# /srv/bmc/intranet-hmg/compose.yml: HOMOLOGAÇÃO (2026-11-17). Ver ../_comum.txt.
name: intranet-hmg
services:
  app:
    image: ${IMAGEM:-bmc/intranet:hmg-20261117}
    container_name: bmc-intranet-hmg
    restart: unless-stopped
    init: true
    oom_score_adj: 900
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    env_file: [ /srv/bmc/intranet-hmg/app.env ]
    ports: [ "127.0.0.1:13003:3000" ]
    volumes:
      - /srv/bmc/intranet-hmg/data:/app/data:Z
    extra_hosts:
      - "smtp.office365.com=127.0.0.1"
      - "smtp.office365.com=::1"
      - "smtp-mail.outlook.com=127.0.0.1"
      - "smtp-mail.outlook.com=::1"
      - "smtp.gmail.com=127.0.0.1"
      - "smtp.gmail.com=::1"
      - "graph.microsoft.com=127.0.0.1"
      - "graph.microsoft.com=::1"
      - "api.twilio.com=127.0.0.1"
      - "api.twilio.com=::1"
      - "api.z-api.io=127.0.0.1"
      - "api.z-api.io=::1"
    deploy:
      resources:
        limits: { memory: 256m, cpus: "0.5" }
