# /srv/bmc/tributario-hmg/compose.yml: HOMOLOGAÇÃO (2026-11-17). Ver ../_comum.txt.
name: tributario-hmg
services:
  app:
    image: ${IMAGEM:-bmc/portal-tributario:hmg-20261117}
    container_name: portaltributario-hmg
    restart: unless-stopped
    init: true
    oom_score_adj: 900
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    env_file: [ /srv/bmc/tributario-hmg/app.env ]
    ports: [ "127.0.0.1:18501:8501" ]
    volumes:
      - /srv/bmc/tributario-hmg/dados:/app/dados:Z
    extra_hosts:
      - "smtp.office365.com=127.0.0.1"
      - "smtp.office365.com=::1"
      - "smtp-mail.outlook.com=127.0.0.1"
      - "smtp-mail.outlook.com=::1"
      - "smtp.gmail.com=127.0.0.1"
      - "smtp.gmail.com=::1"
      - "graph.microsoft.com=127.0.0.1"
      - "graph.microsoft.com=::1"
      - "api.twilio.com=127.0.0.1"
      - "api.twilio.com=::1"
      - "api.z-api.io=127.0.0.1"
      - "api.z-api.io=::1"
      - "metabase.bmchyundai.com.br:10.7.0.105"
    deploy:
      resources:
        limits: { memory: 512m, cpus: "1.0" }
