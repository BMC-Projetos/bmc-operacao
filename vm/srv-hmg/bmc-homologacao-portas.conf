    <Proxy *>
        Require all granted
    </Proxy>
    Header always set X-Ambiente "homologacao"
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "8892"
    RequestHeader set X-Forwarded-Host "hmg-tributario.bmchyundai.com.br:8892"
    RequestHeader unset Accept-Encoding
    ProxyPass "/_stcore/stream" "ws://127.0.0.1:18501/_stcore/stream"
    ProxyPassReverse "/_stcore/stream" "ws://127.0.0.1:18501/_stcore/stream"
    ProxyPass "/" "http://127.0.0.1:18501/" retry=1 timeout=300
    ProxyPassReverse "/" "http://127.0.0.1:18501/"
</VirtualHost>

<VirtualHost *:8898>
