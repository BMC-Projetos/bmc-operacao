        Require all granted
    </Proxy>
    Header always set X-Ambiente "homologacao"
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "8898"
    RequestHeader set X-Forwarded-Host "hmg-agentesfiscal.bmchyundai.com.br:8898"
    RequestHeader unset Accept-Encoding
    ProxyPass "/_stcore/stream" "ws://127.0.0.1:18503/_stcore/stream"
    ProxyPassReverse "/_stcore/stream" "ws://127.0.0.1:18503/_stcore/stream"
    ProxyPass "/whatsapp/webhook" "http://127.0.0.1:15050/whatsapp/webhook" retry=1 timeout=300
    ProxyPassReverse "/whatsapp/webhook" "http://127.0.0.1:15050/whatsapp/webhook"
    ProxyPassMatch "^/media/([^/]+)/(.+)$" "http://127.0.0.1:15050/media/$1/$2" retry=1 timeout=300
    ProxyPass "/media/" "http://127.0.0.1:18503/media/"
    ProxyPassReverse "/media/" "http://127.0.0.1:15050/media/"
    ProxyPass "/" "http://127.0.0.1:18503/" retry=1 timeout=300
    ProxyPassReverse "/" "http://127.0.0.1:18503/"
</VirtualHost>

