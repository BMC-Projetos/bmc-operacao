# /etc/httpd/conf.d/bmc-homologacao-portas.conf: homologação nas MESMAS portas da produção
# (8892 Tributário, 8895 Controladoria, 8896 Fechamento+Rocky por nome, 8898 Agentes,
# 8899 Intranet). Acesso externo: NAT 177.67.71.216:<porta> -> BMC_HMG_01 (alias PORTAIS_HMG).
Listen 8892 https
Listen 8895 https
Listen 8896 https
Listen 8898 https
Listen 8899 https

<VirtualHost *:8895>
    ServerName hmg-controladoria.bmchyundai.com.br
    SSLEngine on
    SSLCertificateFile /etc/pki/tls/bmchyundai/cert.pem
    SSLCertificateKeyFile /etc/pki/tls/bmchyundai/privkey.pem
    SSLCertificateChainFile /etc/pki/tls/bmchyundai/chain.pem
    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 300
    <Proxy *>
        Require all granted
    </Proxy>
    Header always set X-Ambiente "homologacao"
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "8895"
    RequestHeader set X-Forwarded-Host "hmg-controladoria.bmchyundai.com.br:8895"
    ProxyPass "/" "http://127.0.0.1:13000/" retry=1 timeout=300
    ProxyPassReverse "/" "http://127.0.0.1:13000/"
</VirtualHost>

<VirtualHost *:8892>
    ServerName hmg-tributario.bmchyundai.com.br
    SSLEngine on
    SSLCertificateFile /etc/pki/tls/bmchyundai/cert.pem
