# /etc/httpd/conf.d/bmc-registro.conf: registro interno para a PRODUÇÃO baixar.
# TLS (*.bmchyundai.com.br), senha (htpasswd), só GET/HEAD e só da AGENT-01.
# O firewalld também só abre a 5443 para 10.7.0.104.
Listen 5443 https
<VirtualHost *:5443>
    ServerName registro-hmg.bmchyundai.com.br
    SSLEngine on
    SSLCertificateFile /etc/pki/tls/bmchyundai/cert.pem
    SSLCertificateKeyFile /etc/pki/tls/bmchyundai/privkey.pem
    SSLCertificateChainFile /etc/pki/tls/bmchyundai/chain.pem
    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 900
    RequestHeader set X-Forwarded-Proto "https"
    Header always set "Docker-Distribution-Api-Version" "registry/2.0"
    # Só leitura: qualquer método além de GET/HEAD é recusado (403) antes da senha
    RewriteEngine On
    RewriteCond %{REQUEST_METHOD} !^(GET|HEAD)$
    RewriteRule ^ - [F]
    <Location "/">
        AuthType Basic
        AuthName "Registro BMC (homologação)"
        AuthUserFile /etc/httpd/bmc-registro.htpasswd
        <RequireAll>
            Require valid-user
            Require ip 10.7.0.104 127.0.0.1
        </RequireAll>
    </Location>
    ProxyPass "/v2" "http://127.0.0.1:5000/v2" retry=1 timeout=900
    ProxyPassReverse "/v2" "http://127.0.0.1:5000/v2"
</VirtualHost>
