# /srv/bmc/controladoria-hmg/compose.yml: HOMOLOGAÇÃO (2026-11-17). Ver ../_comum.txt.
name: controladoria-hmg
services:
  app:
    image: ${IMAGEM:-bmc/controladoria:hmg-20261117}
    container_name: conciliacao-bmc-hmg
    restart: unless-stopped
    init: true
    oom_score_adj: 900
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    env_file: [ /srv/bmc/controladoria-hmg/app.env ]
    ports: [ "127.0.0.1:13000:3000" ]
    volumes:
      - /srv/bmc/controladoria-hmg/dados/uploads:/app/backend/uploads:Z
      - /srv/bmc/controladoria-hmg/dados/repositorio_insumos:/app/repositorio_insumos:Z
      - /srv/bmc/controladoria-hmg/dados/data:/app/backend/data:Z
    extra_hosts:
      - "smtp.office365.com=127.0.0.1"
      - "smtp.office365.com=::1"
      - "smtp-mail.outlook.com=127.0.0.1"
      - "smtp-mail.outlook.com=::1"
      - "smtp.gmail.com=127.0.0.1"
      - "smtp.gmail.com=::1"
      - "graph.microsoft.com=127.0.0.1"
      - "graph.microsoft.com=::1"
      - "api.twilio.com=127.0.0.1"
      - "api.twilio.com=::1"
      - "api.z-api.io=127.0.0.1"
      - "api.z-api.io=::1"
      - "metabase.bmchyundai.com.br:10.7.0.105"
    deploy:
      resources:
        limits: { memory: 1g, cpus: "1.0" }
