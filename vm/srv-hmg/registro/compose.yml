# /srv/bmc/registro/compose.yml: registro de imagens INTERNO (BMC-HMG-01).
# Só escuta em 127.0.0.1:5000. O publicador da HMG-01 envia aqui (sem senha,
# local); a AGENT-01 baixa pelo Apache em registro-hmg.bmchyundai.com.br:5443
# (TLS, senha, só leitura, só o IP 10.7.0.104). Ver bmc-registro.conf.
name: registro
services:
  registro:
    image: registry:2.8.3
    container_name: registro
    restart: unless-stopped
    ports: [ "127.0.0.1:5000:5000" ]
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"      # o publicador apaga versões antigas
      REGISTRY_HTTP_HEADERS_X-Content-Type-Options: "[nosniff]"
    volumes:
      - /srv/bmc/registro/dados:/var/lib/registry:Z
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    deploy:
      resources:
        limits: { memory: 256m, cpus: "0.5" }
