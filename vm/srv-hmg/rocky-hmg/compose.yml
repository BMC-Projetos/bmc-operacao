# /srv/bmc/rocky-hmg/compose.yml: HOMOLOGAÇÃO (2026-11-17). Ver ../_comum.txt.
name: rocky-hmg
services:
  app:
    image: ${IMAGEM:-bmc/rocky-agent:hmg-20261117}
    container_name: rocky-agent-hmg
    restart: unless-stopped
    init: true
    oom_score_adj: 900
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    env_file: [ /srv/bmc/rocky-hmg/app.env ]
    ports: [ "127.0.0.1:13002:3000" ]
    volumes:
      - /srv/bmc/rocky-hmg/campaigns:/app/campaigns:Z
      - /srv/bmc/rocky-hmg/logs:/app/logs:Z
      - /srv/bmc/rocky-hmg/output:/app/output:Z
    extra_hosts:
      - "smtp.office365.com=127.0.0.1"
      - "smtp.office365.com=::1"
      - "smtp-mail.outlook.com=127.0.0.1"
      - "smtp-mail.outlook.com=::1"
      - "smtp.gmail.com=127.0.0.1"
      - "smtp.gmail.com=::1"
      - "graph.microsoft.com=127.0.0.1"
      - "graph.microsoft.com=::1"
      - "api.twilio.com=127.0.0.1"
      - "api.twilio.com=::1"
      - "api.z-api.io=127.0.0.1"
      - "api.z-api.io=::1"
    deploy:
      resources:
        limits: { memory: 1536m, cpus: "1.5" }
