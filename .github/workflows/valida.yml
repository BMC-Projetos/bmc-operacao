# Check obrigatório dos PRs do bmc-operacao.
# Um PR de promoção só pode trocar o digest de um serviço conhecido, com a
# imagem vinda do registro interno da BMC (montada na HMG-01 a partir de um
# commit que passou no CI). O registro é interno e o GitHub não o enxerga:
# aqui se confere o FORMATO; quem baixa e confere o digest é a AGENT-01.
name: valida

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  valida:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      REGISTRO: registro-hmg.bmchyundai.com.br:5443
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Só arquivos permitidos
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          AUTOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE"...HEAD > alterados.txt
          cat alterados.txt
          # PR do robô (bmc-promotor) só pode mexer em servicos/<serviço>/producao.env.
          # PR de pessoa (TI) pode mexer no resto, revisado pelo CODEOWNERS.
          if [[ "$AUTOR" == *"[bot]" ]]; then
            if grep -vE '^servicos/[a-z0-9-]+/producao\.env$' alterados.txt; then
              echo "::error::o robô só pode alterar servicos/<serviço>/producao.env"; exit 1
            fi
          fi

      - name: Formato da imagem e do commit
        run: |
          set -euo pipefail
          falhou=0
          for f in $(grep -E '^servicos/[a-z0-9-]+/producao\.env$' alterados.txt || true); do
            [ -f "$f" ] || { echo "$f removido: só a TI remove serviço"; continue; }
            svc="$(basename "$(dirname "$f")")"
            img="$(grep -E '^IMAGEM=' "$f" | tail -n1 | cut -d= -f2-)"
            com="$(grep -E '^COMMIT=' "$f" | tail -n1 | cut -d= -f2-)"
            esc=$(printf '%s' "$REGISTRO" | sed 's/[.]/[.]/g')   # ponto literal
            re="^${esc}/${svc}@sha256:[a-f0-9]{64}$"
            if ! [[ "$img" =~ $re ]]; then
              echo "::error file=$f::IMAGEM tem que ser $REGISTRO/$svc@sha256:<64 hex> (veio: $img)"; falhou=1; continue
            fi
            if ! [[ "$com" =~ ^[a-f0-9]{40}$ ]]; then
              echo "::error file=$f::COMMIT tem que ser o sha completo do repo $svc"; falhou=1; continue
            fi
            echo "ok  $svc  ${img##*@}  commit $com"
            {
              echo "### $svc"
              echo "- imagem: \`$img\`"
              echo "- commit: \`$com\`"
            } >> "$GITHUB_STEP_SUMMARY"
          done
          exit "$falhou"
